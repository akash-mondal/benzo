[package]
name = "benzo-pczt"
version = "0.1.0"
edition = "2024"
publish = false

# Exact versions from zcash-devtool@5a26ee854e634a4e88d1d79dab13f8fbb1eac6b8 Cargo.lock.
[dependencies]
anyhow = "=1.0.104"
hex = "=0.4.3"
orchard = { version = "=0.15.3", default-features = false }
pczt = { version = "=0.9.3", features = ["orchard"] }
rand = "=0.8.7"
serde_json = "=1.0.151"
zcash_address = "=0.13.0"
zcash_client_backend = { version = "=0.24.0", features = ["orchard", "pczt"] }
zcash_client_sqlite = { version = "=0.22.0", features = ["orchard", "transparent-inputs", "serde"] }
zcash_keys = { version = "=0.16.1", features = ["orchard"] }
zcash_primitives = "=0.30.1"
zcash_protocol = "=0.10.5"
zcash_note_encryption = "=0.4.2"
zip321 = "=0.9.0"
