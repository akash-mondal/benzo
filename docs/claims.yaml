# The ceiling for every public word about Benzo: README, deck, video, demo copy, submission text.
# Nothing public may claim more than a claim here says, and each status follows its evidence.
# Statuses: testnet_live (ran on a public testnet), offline_verified (real drand and real tools, no chain),
#           projected (computed from measured points, never run at that size), not_built.
# Update this file before the words that cite it, never after.
claims:
  - id: operator-blind
    text: "Before the drand round R nobody, the operator included, can read any order's price or quantity."
    status: testnet_live
    environments: [zcash-testnet, drand-quicknet]
    evidence:
      - docs/evidence/phase-1/EVIDENCE.md
      - docs/evidence/phase-6/rg/testnet-golden-path
    limits: "Enforced by drand timelock: a colluding drand threshold could open early. A compromised bidder client can leak its own bid."

  - id: no-reveal-step
    text: "Orders open at R without any action from bidders. There is no reveal step, so no bidder can withhold an order after seeing others."
    status: testnet_live
    environments: [zcash-testnet, drand-quicknet]
    evidence:
      - docs/evidence/phase-2/EVIDENCE.md
    limits: "All orders become public at R, anonymized per leaf. Losing bids are not secret forever."

  - id: unlinkable-bidders
    text: "No address links an order to a wallet: deposits are shielded and every deposit is the same fixed C."
    status: testnet_live
    environments: [zcash-testnet]
    evidence:
      - docs/evidence/phase-6/leak-audit.md
    limits: "Network metadata (IP, timing) needs Tor or a VPN. Bridging straight to a deposit address can link it on the source chain."

  - id: six-modes-live
    text: "Six market modes ran end to end on Zcash testnet: uniform, collection drop, launch, buyback, RFQ and blind OTC."
    status: testnet_live
    environments: [zcash-testnet]
    evidence:
      - docs/evidence/phase-6/lp-0004.md
      - docs/evidence/phase-6/rg/markets
      - docs/evidence/phase-6/rg/buyback-mode
    limits: "Vickrey's distinct first and second price is offline-verified only (the live sample prices tied)."

  - id: frost-host-custody
    text: "Settlement is 2-of-3 FROST under host custody: each signer host re-derives every output from its own chain scan and checks it before signing."
    status: testnet_live
    environments: [zcash-testnet, three-signer-vms]
    evidence:
      - docs/evidence/phase-5/y2-r28
      - docs/evidence/phase-7/rel-walk-ca34e2a
    limits: "One operator provisioned all three testnet hosts with the same lightwalletd endpoint. Two colluding signers can steal or freeze the vault. Testnet has one NU7 endpoint (BNZ_LWD_SINGLE=1)."

  - id: anyone-verifies
    text: "Anyone can recompute a whole auction from its public directory with one standalone file that rebuilds byte-for-byte."
    status: testnet_live
    environments: [any-machine-with-node-24]
    evidence:
      - docs/verify-it-yourself.md
      - docs/reproducible-build.md
      - docs/evidence/phase-7/rel-walk-ca34e2a/public
    limits: "A chain reorg after the freeze makes an honest auction fail verify (H17). A colluding 2-of-3 can misdirect a refund and the public cannot tell (R16 F6)."

  - id: crash-safe-settlement
    text: "A settlement worker killed mid-batch resumes and pays every obligation exactly once."
    status: testnet_live
    environments: [zcash-testnet]
    evidence:
      - docs/evidence/phase-6/rg/settle-crash
    limits: "Last live pass Oct 18 at 910a531. It must pass again in the final RG after B55."

  - id: fee-reserve-returned
    text: "After settlement the leftover fee reserve returns to the operator's committed address, and the public accounting shows it."
    status: testnet_live
    environments: [zcash-testnet]
    evidence:
      - docs/evidence/phase-7/h15-live
      - docs/evidence/phase-7/rel-walk-ca34e2a
    limits: "It waits until nothing else is owed. Dust notes (5,000 zats or less each) stay in the vault. One transaction only, up to 29 spends or 29 padded actions (H25)."

  - id: stealth-delivery
    text: "A cross-chain payout was delivered to an ERC-5564 stealth address on Ethereum Sepolia; the winner found it with the viewing key and spent it with the spending key."
    status: testnet_live
    environments: [ethereum-sepolia]
    evidence:
      - docs/evidence/phase-5/repro/stealth-live.out
    limits: "The stealth derivation reproducible by signers is custom code (docs/AUDITS.md). Cross-chain delivery is public on the target chain: the escrow release names the auction and the winning leaf, so a payout can be matched to its opened bid. Stealth hides the winner's long-term address, not that match; a direct (non-stealth) address hides neither."

  - id: solana-confidential
    text: "Token-2022 confidential transfer ran on Solana devnet as a standalone demo."
    status: testnet_live
    environments: [solana-devnet]
    evidence:
      - docs/evidence/phase-5/repro/ct-live.out
    limits: "Not an escrow delivery: the Solana escrow pays native SOL only."

  - id: scale-17k-offline
    text: "17,000 sealed bids were admitted, frozen, opened, cleared and verified offline with real tlock."
    status: offline_verified
    environments: [offline, drand-quicknet-past-round]
    evidence:
      - docs/evidence/phase-6/bench.json
    limits: "Synthetic bids. Open took 451 s and verify 455 s on one machine."

  - id: scale-17k-settlement
    text: "Settling 17,000 bids projects to about 600 batches and roughly a day on testnet."
    status: projected
    environments: [projection]
    evidence:
      - docs/evidence/phase-6/scale-measure.md
      - docs/evidence/phase-6/scale
    limits: "Measured live at 55 bids, not at full size. Do not say it settles 17,000 bids."

  - id: mainnet
    text: "No mainnet transaction has been made."
    status: not_built
    environments: []
    evidence: []
    limits: "Say 'testnet' everywhere until this changes."
