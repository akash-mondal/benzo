<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-label="Six markets on one engine: uniform auction, collection drop, token launch, buyback, RFQ and blind OTC, each a clearing rule in one registry." font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"><title>Six markets on one engine: uniform auction, collection drop, token launch, buyback, RFQ and blind OTC, each a clearing rule in one registry.</title><defs><linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0.36"><stop offset="0" stop-color="#a99f86"/><stop offset=".3" stop-color="#fbf6e8"/><stop offset=".52" stop-color="#c2b799"/><stop offset=".74" stop-color="#f4eedd"/><stop offset="1" stop-color="#a99f86"/></linearGradient>
<linearGradient id="goldc" x1="0" y1="0" x2="1" y2="0.36"><stop offset="0" stop-color="#b89a52"/><stop offset=".35" stop-color="#f6e2a6"/><stop offset=".6" stop-color="#d9b866"/><stop offset="1" stop-color="#b89a52"/></linearGradient>
<linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4efe2"/><stop offset="1" stop-color="#d9d1bd"/></linearGradient>
<radialGradient id="night" cx="72%" cy="18%" r="85%"><stop offset="0" stop-color="#1f2a19"/><stop offset=".6" stop-color="#141a10"/></radialGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b9b3a3"/></marker>
<marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e9cd84"/></marker></defs><rect width="1200" height="490" rx="22" fill="url(#night)"/><g transform="translate(0 -50)"><rect x="64" y="104" width="336" height="164" rx="14" fill="#1c2417" stroke="#ddd6c6" stroke-opacity=".16"/><svg x="86" y="128" width="56" height="56" viewBox="0 0 200 200"><defs><mask id="gv-1" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200"><rect width="200" height="200" fill="#fff"/><path d="M64 58 V82 M136 58 V82" fill="none" stroke="#000" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M58 70 H142" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M100 118 V148 M100 158 V164" fill="none" stroke="#000" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 166 H120" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="42" cy="70" r="3" fill="#000"/><circle cx="158" cy="70" r="3" fill="#000"/></mask></defs><g mask="url(#gv-1)" transform="rotate(-38 100 100)"><rect x="52" y="48" width="96" height="44" rx="12" fill="#fff"/><rect x="36" y="40" width="20" height="60" rx="8" fill="#fff"/><rect x="144" y="40" width="20" height="60" rx="8" fill="#fff"/><rect x="92" y="92" width="16" height="84" rx="8" fill="#fff"/></g><g><defs><mask id="gb-1" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200"><rect width="200" height="200" fill="#fff"/><path d="M30 172 H118" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></mask></defs><rect mask="url(#gb-1)" x="22" y="160" width="104" height="24" rx="8" fill="url(#chrome)"/></g><path d="M138 160 L156 150 M142 176 L164 176 M134 144 L146 128" fill="none" stroke="url(#chrome)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <text x="158" y="164" font-size="22" fill="#ebe5d6" font-weight="600">Uniform auction</text>
      <text x="88" y="218" font-size="16.5" fill="#b9b3a3" >k units go to the k highest bids;</text><text x="88" y="242" font-size="16.5" fill="#b9b3a3" >all pay the lowest winning bid</text><rect x="424" y="104" width="336" height="164" rx="14" fill="#1c2417" stroke="#ddd6c6" stroke-opacity=".16"/><svg x="446" y="128" width="56" height="56" viewBox="0 0 200 200"><defs><mask id="gf-2" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200"><rect width="200" height="200" fill="#fff"/><path d="M100 58 V176" fill="none" stroke="#000" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M30 120 H170" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M36 92 H164" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></mask></defs><g mask="url(#gf-2)"><rect x="30" y="84" width="140" height="94" rx="8" fill="url(#chrome)"/><rect x="20" y="58" width="160" height="32" rx="8" fill="url(#chrome)"/></g><path d="M92 58 V178 M108 58 V178" fill="none" stroke="url(#chrome)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M100 56 C70 14 38 32 60 52 C68 60 86 58 100 56 Z M100 56 C130 14 162 32 140 52 C132 60 114 58 100 56 Z" fill="url(#chrome)"/><circle cx="100" cy="56" r="8" fill="url(#chrome)"/></svg>
      <text x="518" y="164" font-size="22" fill="#ebe5d6" font-weight="600">Collection drop</text>
      <text x="448" y="218" font-size="16.5" fill="#b9b3a3" >one winner per numbered lot;</text><text x="448" y="242" font-size="16.5" fill="#b9b3a3" >drand orders the serials</text><rect x="784" y="104" width="336" height="164" rx="14" fill="#1c2417" stroke="#ddd6c6" stroke-opacity=".16"/><svg x="806" y="128" width="56" height="56" viewBox="0 0 200 200"><defs><mask id="rk-3" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200"><rect width="200" height="200" fill="#fff"/><circle cx="100" cy="72" r="15" fill="none" stroke="#000" stroke-width="5"/><circle cx="100" cy="72" r="9" fill="#000"/><path d="M76 104 H124 M80 124 H120" fill="none" stroke="#000" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M100 22 V40" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="82" cy="114" r="2.6" fill="#000"/><circle cx="118" cy="114" r="2.6" fill="#000"/><path d="M54 124 L46 140 M146 124 L154 140" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M90 156 Q100 176 110 156" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></mask></defs><g mask="url(#rk-3)"><path d="M100 12 C138 42 146 94 132 138 H68 C54 94 62 42 100 12 Z" fill="url(#chrome)"/><path d="M70 100 L36 144 L40 158 L72 140 Z M130 100 L164 144 L160 158 L128 140 Z" fill="url(#chrome)"/><path d="M78 140 H122 V150 H78 Z" fill="url(#chrome)"/><path d="M84 152 C84 176 100 192 100 192 C100 192 116 176 116 152 Z" fill="url(#chrome)"/></g><path d="M34 33 Q34 40 41 40 Q34 40 34 47 Q34 40 27 40 Q34 40 34 33 Z" fill="url(#chrome)"/><path d="M168 65 Q168 70 173 70 Q168 70 168 75 Q168 70 163 70 Q168 70 168 65 Z" fill="url(#chrome)"/><path d="M40 82 Q40 86 44 86 Q40 86 40 90 Q40 86 36 86 Q40 86 40 82 Z" fill="url(#chrome)"/></svg>
      <text x="878" y="164" font-size="22" fill="#ebe5d6" font-weight="600">Token launch</text>
      <text x="808" y="218" font-size="16.5" fill="#b9b3a3" >one price if the minimum raise</text><text x="808" y="242" font-size="16.5" fill="#b9b3a3" >is met, otherwise full refunds</text><rect x="64" y="292" width="336" height="164" rx="14" fill="#1c2417" stroke="#ddd6c6" stroke-opacity=".16"/><svg x="86" y="316" width="56" height="56" viewBox="0 0 200 200"><defs><mask id="rc-4" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200"><rect width="200" height="200" fill="#fff"/><circle cx="100" cy="100" r="30" fill="none" stroke="#000" stroke-width="3.5"/><path d="M88 86 H112 L88 114 H112 M100 76 V86 M100 114 V124" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></mask></defs><circle mask="url(#rc-4)" cx="100" cy="100" r="40" fill="url(#chrome)"/><path d="M162 104 A62 62 0 1 1 134 48" fill="none" stroke="url(#chrome)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><path d="M114 24 L146 42 L120 68 Z" fill="url(#chrome)"/><path d="M100 12 v6 M100 182 v6 M12 100 h6" fill="none" stroke="url(#chrome)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <text x="158" y="352" font-size="22" fill="#ebe5d6" font-weight="600">Buyback</text>
      <text x="88" y="406" font-size="16.5" fill="#b9b3a3" >the cheapest asks are bought</text><text x="88" y="430" font-size="16.5" fill="#b9b3a3" >until the budget runs out</text><rect x="424" y="292" width="336" height="164" rx="14" fill="#1c2417" stroke="#ddd6c6" stroke-opacity=".16"/><svg x="446" y="316" width="56" height="56" viewBox="0 0 200 200"><defs><mask id="qb-5" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200"><rect width="200" height="200" fill="#fff"/><path d="M62 74 H138 M62 96 H120 M62 118 H104" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="150" y="122" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="34" fill="#000">?</text></mask></defs><path mask="url(#qb-5)" d="M26 34 H174 V140 H90 L48 176 V140 H26 Z" fill="url(#chrome)" stroke="url(#chrome)" stroke-width="6" stroke-linejoin="round"/><circle cx="174" cy="34" r="0" fill="url(#chrome)"/></svg>
      <text x="518" y="352" font-size="22" fill="#ebe5d6" font-weight="600">RFQ</text>
      <text x="448" y="406" font-size="16.5" fill="#b9b3a3" >the lowest quote wins; the</text><text x="448" y="430" font-size="16.5" fill="#b9b3a3" >second lowest sets the price</text><rect x="784" y="292" width="336" height="164" rx="14" fill="#1c2417" stroke="#ddd6c6" stroke-opacity=".16"/><svg x="806" y="316" width="56" height="56" viewBox="0 0 200 200"><defs><mask id="pc-6" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200"><rect width="200" height="200" fill="#fff"/><circle cx="40" cy="100" r="18" fill="none" stroke="#000" stroke-width="3.5"/><circle cx="160" cy="100" r="18" fill="none" stroke="#000" stroke-width="3.5"/><path d="M92 100 L100 92 L108 100 L100 108 Z" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></mask></defs><g mask="url(#pc-6)"><circle cx="40" cy="100" r="30" fill="url(#chrome)"/><circle cx="160" cy="100" r="30" fill="url(#chrome)"/><path d="M100 72 L128 100 L100 128 L72 100 Z" fill="url(#chrome)"/></g><path d="M70 100 H72 M128 100 H130" stroke="url(#chrome)" stroke-width="10"/><path d="M40 140 V160 M160 140 V160 M40 160 H160" fill="none" stroke="url(#chrome)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M100 128 V160" fill="none" stroke="url(#chrome)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <text x="878" y="352" font-size="22" fill="#ebe5d6" font-weight="600">Blind OTC</text>
      <text x="808" y="406" font-size="16.5" fill="#b9b3a3" >two sealed limits; if they</text><text x="808" y="430" font-size="16.5" fill="#b9b3a3" >cross, trade at the midpoint</text><text x="64" y="510" font-size="17" fill="#ebe5d6" >Same deposit, same freeze, same opening. A market is one entry in clear/registry.ts: a layout, a rule, a result check.</text></g><rect x=".5" y=".5" width="1199" height="489" rx="22" fill="none" stroke="#ddd6c6" stroke-opacity=".12"/></svg>