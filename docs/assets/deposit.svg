<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="Three bids on chain: each a shielded payment of 200,000 zats to its own deposit address with a 512-byte sealed memo. The refund address travels in an envelope sealed to the three signers." font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"><title>Three bids on chain: each a shielded payment of 200,000 zats to its own deposit address with a 512-byte sealed memo. The refund address travels in an envelope sealed to the three signers.</title><defs><linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0.36"><stop offset="0" stop-color="#a99f86"/><stop offset=".3" stop-color="#fbf6e8"/><stop offset=".52" stop-color="#c2b799"/><stop offset=".74" stop-color="#f4eedd"/><stop offset="1" stop-color="#a99f86"/></linearGradient>
<linearGradient id="goldc" x1="0" y1="0" x2="1" y2="0.36"><stop offset="0" stop-color="#b89a52"/><stop offset=".35" stop-color="#f6e2a6"/><stop offset=".6" stop-color="#d9b866"/><stop offset="1" stop-color="#b89a52"/></linearGradient>
<linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4efe2"/><stop offset="1" stop-color="#d9d1bd"/></linearGradient>
<radialGradient id="night" cx="72%" cy="18%" r="85%"><stop offset="0" stop-color="#1f2a19"/><stop offset=".6" stop-color="#141a10"/></radialGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b9b3a3"/></marker>
<marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e9cd84"/></marker></defs><rect width="1200" height="470" rx="22" fill="url(#night)"/><g transform="translate(0 -50)"><rect x="64" y="104" width="218" height="176" rx="14" fill="#1c2417" stroke="#ddd6c6" stroke-opacity=".16"/>
      <text x="86" y="140" font-size="16" fill="#8f8a7c" font-weight="600">shielded payment</text>
      <text x="86" y="176" font-size="24" fill="#ebe5d6" font-weight="600">200,000 zats</text>
      <text x="86" y="210" font-size="16" fill="#b9b3a3" >to deposit address d₁</text>
      <text x="86" y="238" font-size="16" fill="#b9b3a3" >memo: 512 sealed bytes</text>
      <text x="86" y="264" font-size="16" fill="#b9b3a3" >sender: not on chain</text><rect x="302" y="104" width="218" height="176" rx="14" fill="#1c2417" stroke="#ddd6c6" stroke-opacity=".16"/>
      <text x="324" y="140" font-size="16" fill="#8f8a7c" font-weight="600">shielded payment</text>
      <text x="324" y="176" font-size="24" fill="#ebe5d6" font-weight="600">200,000 zats</text>
      <text x="324" y="210" font-size="16" fill="#b9b3a3" >to deposit address d₂</text>
      <text x="324" y="238" font-size="16" fill="#b9b3a3" >memo: 512 sealed bytes</text>
      <text x="324" y="264" font-size="16" fill="#b9b3a3" >sender: not on chain</text><rect x="540" y="104" width="218" height="176" rx="14" fill="#1c2417" stroke="#ddd6c6" stroke-opacity=".16"/>
      <text x="562" y="140" font-size="16" fill="#8f8a7c" font-weight="600">shielded payment</text>
      <text x="562" y="176" font-size="24" fill="#ebe5d6" font-weight="600">200,000 zats</text>
      <text x="562" y="210" font-size="16" fill="#b9b3a3" >to deposit address d₃</text>
      <text x="562" y="238" font-size="16" fill="#b9b3a3" >memo: 512 sealed bytes</text>
      <text x="562" y="264" font-size="16" fill="#b9b3a3" >sender: not on chain</text><text x="64" y="326" font-size="18" fill="#ebe5d6" font-weight="600">Same amount, same memo length, a fresh address each:</text><text x="64" y="352" font-size="18" fill="#ebe5d6" font-weight="600">nothing on chain ranks them.</text><text x="64" y="390" font-size="16.5" fill="#b9b3a3" >Every deposit address belongs to the round's vault: a 2-of-3</text><text x="64" y="414" font-size="16.5" fill="#b9b3a3" >FROST key the three signers made for this round only.</text><rect x="828" y="104" width="308" height="380" rx="14" fill="#1c2417" stroke="#ddd6c6" stroke-opacity=".16"/>
    <text x="850" y="142" font-size="21" fill="#ebe5d6" font-weight="600">The refund envelope</text>
    <text x="850" y="170" font-size="16" fill="#b9b3a3" >public, but readable only</text><text x="850" y="192" font-size="16" fill="#b9b3a3" >with a signer's own key</text><rect x="850" y="214" width="264" height="40" rx="8" fill="#232d1d"/><text x="864" y="240" font-size="16" fill="#e9cd84" font-weight="600">alice</text><text x="1100" y="240" font-size="15.5" fill="#b9b3a3" text-anchor="end">X25519 sealed box</text><rect x="850" y="264" width="264" height="40" rx="8" fill="#232d1d"/><text x="864" y="290" font-size="16" fill="#e9cd84" font-weight="600">bob</text><text x="1100" y="290" font-size="15.5" fill="#b9b3a3" text-anchor="end">X25519 sealed box</text><rect x="850" y="314" width="264" height="40" rx="8" fill="#232d1d"/><text x="864" y="340" font-size="16" fill="#e9cd84" font-weight="600">carol</text><text x="1100" y="340" font-size="15.5" fill="#b9b3a3" text-anchor="end">X25519 sealed box</text><rect x="850" y="370" width="264" height="40" rx="8" fill="#2a2a18" stroke="#e9cd84" stroke-opacity=".7"/>
    <text x="982" y="396" font-size="16" fill="#ebe5d6" text-anchor="middle" font-weight="600">your refund address</text><text x="850" y="440" font-size="15.5" fill="#b9b3a3" >Bound to its deposit by the</text><text x="850" y="462" font-size="15.5" fill="#b9b3a3" >memo's envelope tag.</text></g><rect x=".5" y=".5" width="1199" height="469" rx="22" fill="none" stroke="#ddd6c6" stroke-opacity=".12"/></svg>