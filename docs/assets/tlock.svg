<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="tlock: the browser encrypts to drand round R; the key is drand's threshold signature on R, which only exists once round R is published." font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"><title>tlock: the browser encrypts to drand round R; the key is drand's threshold signature on R, which only exists once round R is published.</title><defs><linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0.36"><stop offset="0" stop-color="#a99f86"/><stop offset=".3" stop-color="#fbf6e8"/><stop offset=".52" stop-color="#c2b799"/><stop offset=".74" stop-color="#f4eedd"/><stop offset="1" stop-color="#a99f86"/></linearGradient>
<linearGradient id="goldc" x1="0" y1="0" x2="1" y2="0.36"><stop offset="0" stop-color="#b89a52"/><stop offset=".35" stop-color="#f6e2a6"/><stop offset=".6" stop-color="#d9b866"/><stop offset="1" stop-color="#b89a52"/></linearGradient>
<linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4efe2"/><stop offset="1" stop-color="#d9d1bd"/></linearGradient>
<radialGradient id="night" cx="72%" cy="18%" r="85%"><stop offset="0" stop-color="#1f2a19"/><stop offset=".6" stop-color="#141a10"/></radialGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b9b3a3"/></marker>
<marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e9cd84"/></marker></defs><rect width="1200" height="400" rx="22" fill="url(#night)"/><g transform="translate(0 -50)"><rect x="64" y="104" width="340" height="286" rx="14" fill="#1c2417" stroke="#ddd6c6" stroke-opacity=".16"/>
    <text x="92" y="146" font-size="22" fill="#ebe5d6" font-weight="600">Your browser</text>
    <text x="92" y="182" font-size="17" fill="#b9b3a3" >knows the order and drand's</text><text x="92" y="206" font-size="17" fill="#b9b3a3" >public key, and encrypts to the</text>
    <text x="92" y="230" font-size="17" fill="#b9b3a3" >identity “round R”:</text>
    <rect x="92" y="250" width="284" height="56" rx="10" fill="#232d1d"/>
    <text x="234" y="285" font-size="19" fill="#e9cd84" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">c = Enc(pk, R, order)</text>
    <text x="92" y="342" font-size="17" fill="#b9b3a3" >No one keeps a secret key:</text><text x="92" y="366" font-size="17" fill="#ebe5d6" font-weight="600">it doesn't exist yet.</text><text x="470" y="136" font-size="19" fill="#ebe5d6" font-weight="600">drand quicknet: a new round every 3 seconds</text><text x="470" y="164" font-size="16" fill="#b9b3a3" >Each round's value is a BLS12-381 signature on its number, made only</text><text x="470" y="186" font-size="16" fill="#b9b3a3" >when a threshold of the League of Entropy's nodes sign together.</text><line x1="518" y1="236" x2="566" y2="236" stroke="#ddd6c6" stroke-opacity="0.35" stroke-width="2" /><rect x="470" y="214" width="48" height="44" rx="9" fill="#232d1d" stroke="#ddd6c6" stroke-opacity="0.35" stroke-width="1.5" /><text x="494" y="242" font-size="14.5" fill="#b9b3a3" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="600">R−5</text><line x1="614" y1="236" x2="662" y2="236" stroke="#ddd6c6" stroke-opacity="0.35" stroke-width="2" /><rect x="566" y="214" width="48" height="44" rx="9" fill="#232d1d" stroke="#ddd6c6" stroke-opacity="0.35" stroke-width="1.5" /><text x="590" y="242" font-size="14.5" fill="#b9b3a3" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="600">R−4</text><line x1="710" y1="236" x2="758" y2="236" stroke="#ddd6c6" stroke-opacity="0.35" stroke-width="2" /><rect x="662" y="214" width="48" height="44" rx="9" fill="#232d1d" stroke="#ddd6c6" stroke-opacity="0.35" stroke-width="1.5" /><text x="686" y="242" font-size="14.5" fill="#b9b3a3" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="600">R−3</text><line x1="806" y1="236" x2="854" y2="236" stroke="#ddd6c6" stroke-opacity="0.35" stroke-width="2" /><rect x="758" y="214" width="48" height="44" rx="9" fill="#232d1d" stroke="#ddd6c6" stroke-opacity="0.35" stroke-width="1.5" /><text x="782" y="242" font-size="14.5" fill="#b9b3a3" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="600">R−2</text><line x1="902" y1="236" x2="950" y2="236" stroke="#ddd6c6" stroke-opacity="0.35" stroke-width="2" /><rect x="854" y="214" width="48" height="44" rx="9" fill="#232d1d" stroke="#ddd6c6" stroke-opacity="0.35" stroke-width="1.5" /><text x="878" y="242" font-size="14.5" fill="#b9b3a3" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="600">R−1</text><line x1="998" y1="236" x2="1046" y2="236" stroke="#ddd6c6" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="5 5"/><rect x="950" y="214" width="48" height="44" rx="9" fill="#2a2a18" stroke="#e9cd84" stroke-opacity="1" stroke-width="2.5" /><text x="974" y="242" font-size="14.5" fill="#e9cd84" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="600">R</text><rect x="1046" y="214" width="48" height="44" rx="9" fill="#141a10" stroke="#ddd6c6" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="4 4"/><text x="1070" y="242" font-size="14.5" fill="#8f8a7c" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="600">R+1</text><line x1="974" y1="266" x2="974" y2="306" stroke="#e9cd84" stroke-width="2" marker-end="url(#arrowg)"/><text x="974" y="332" font-size="17" fill="#e9cd84" text-anchor="middle" font-weight="600">σ_R = the key</text><text x="470" y="372" font-size="17" fill="#ebe5d6" >Before R, opening c means forging a drand signature. At R, σ_R is published</text><text x="470" y="398" font-size="17" fill="#ebe5d6" >for everyone, so every bid in the round opens at the same moment.</text></g><rect x=".5" y=".5" width="1199" height="399" rx="22" fill="none" stroke="#ddd6c6" stroke-opacity=".12"/></svg>