<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-label="The 128-byte order (version, round id, price, quantity, nonce, owner key, settlement commitment, flag) is tlock-encrypted and carried in a 512-byte memo: magic, length, ciphertext, envelope tag, zero padding." font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"><title>The 128-byte order (version, round id, price, quantity, nonce, owner key, settlement commitment, flag) is tlock-encrypted and carried in a 512-byte memo: magic, length, ciphertext, envelope tag, zero padding.</title><defs><linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0.36"><stop offset="0" stop-color="#a99f86"/><stop offset=".3" stop-color="#fbf6e8"/><stop offset=".52" stop-color="#c2b799"/><stop offset=".74" stop-color="#f4eedd"/><stop offset="1" stop-color="#a99f86"/></linearGradient>
<linearGradient id="goldc" x1="0" y1="0" x2="1" y2="0.36"><stop offset="0" stop-color="#b89a52"/><stop offset=".35" stop-color="#f6e2a6"/><stop offset=".6" stop-color="#d9b866"/><stop offset="1" stop-color="#b89a52"/></linearGradient>
<linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4efe2"/><stop offset="1" stop-color="#d9d1bd"/></linearGradient>
<radialGradient id="night" cx="72%" cy="18%" r="85%"><stop offset="0" stop-color="#1f2a19"/><stop offset=".6" stop-color="#141a10"/></radialGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b9b3a3"/></marker>
<marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e9cd84"/></marker></defs><rect width="1200" height="450" rx="22" fill="url(#night)"/><g transform="translate(0 -50)"><text x="64" y="110" font-size="19" fill="#ebe5d6" font-weight="600">The order: 128 bytes, built in your browser</text><rect x="65" y="128" width="54" height="62" rx="8" fill="#232d1d" stroke="#ddd6c6" stroke-opacity="0.2"/><text x="92" y="156" font-size="15.5" fill="#ebe5d6" text-anchor="middle" font-weight="600" >v</text><text x="92" y="178" font-size="14.5" fill="#b9b3a3" text-anchor="middle">1 B</text><rect x="121" y="128" width="198" height="62" rx="8" fill="#232d1d" stroke="#ddd6c6" stroke-opacity="0.2"/><text x="220" y="156" font-size="15.5" fill="#ebe5d6" text-anchor="middle" font-weight="600" >round or lot id</text><text x="220" y="178" font-size="14.5" fill="#b9b3a3" text-anchor="middle">32 B</text><rect x="321" y="128" width="118" height="62" rx="8" fill="#2a2a18" stroke="#e9cd84" stroke-opacity="0.9"/><text x="380" y="156" font-size="15.5" fill="#e9cd84" text-anchor="middle" font-weight="600" >price</text><text x="380" y="178" font-size="14.5" fill="#b9b3a3" text-anchor="middle">8 B · u64</text><rect x="441" y="128" width="74" height="62" rx="8" fill="#232d1d" stroke="#ddd6c6" stroke-opacity="0.2"/><text x="478" y="156" font-size="15.5" fill="#ebe5d6" text-anchor="middle" font-weight="600" >qty</text><text x="478" y="178" font-size="14.5" fill="#b9b3a3" text-anchor="middle">4 B</text><rect x="517" y="128" width="108" height="62" rx="8" fill="#232d1d" stroke="#ddd6c6" stroke-opacity="0.2"/><text x="571" y="156" font-size="15.5" fill="#ebe5d6" text-anchor="middle" font-weight="600" >nonce</text><text x="571" y="178" font-size="14.5" fill="#b9b3a3" text-anchor="middle">16 B</text><rect x="627" y="128" width="168" height="62" rx="8" fill="#232d1d" stroke="#ddd6c6" stroke-opacity="0.2"/><text x="711" y="156" font-size="15.5" fill="#ebe5d6" text-anchor="middle" font-weight="600" >owner key</text><text x="711" y="178" font-size="14.5" fill="#b9b3a3" text-anchor="middle">32 B · Ed25519</text><rect x="797" y="128" width="234" height="62" rx="8" fill="#232d1d" stroke="#ddd6c6" stroke-opacity="0.2"/><text x="914" y="156" font-size="15.5" fill="#ebe5d6" text-anchor="middle" font-weight="600" >settlement commitment</text><text x="914" y="178" font-size="14.5" fill="#b9b3a3" text-anchor="middle">32 B · salted</text><rect x="1033" y="128" width="102" height="62" rx="8" fill="#232d1d" stroke="#ddd6c6" stroke-opacity="0.2"/><text x="1084" y="156" font-size="15.5" fill="#ebe5d6" text-anchor="middle" font-weight="600" >flag</text><text x="1084" y="178" font-size="14.5" fill="#b9b3a3" text-anchor="middle">3 B</text><line x1="600" y1="208" x2="600" y2="268" stroke="#e9cd84" stroke-width="2" marker-end="url(#arrowg)"/><text x="620" y="244" font-size="17" fill="#e9cd84" >tlock-encrypt to drand round R: an age ciphertext of at most 487 bytes</text><text x="64" y="306" font-size="19" fill="#ebe5d6" font-weight="600">The memo: exactly 512 bytes, inside a shielded payment</text><rect x="65" y="324" width="161.04182509505705" height="62" rx="8" fill="#232d1d" stroke="#ddd6c6" stroke-opacity="0.2"/><text x="145.52091254752852" y="352" font-size="15.5" fill="#ebe5d6" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">ff 42 4e 5a 02</text><text x="145.52091254752852" y="374" font-size="14.5" fill="#b9b3a3" text-anchor="middle">5 B · “BNZ” v2</text><rect x="228.04182509505705" y="324" width="75.4448669201521" height="62" rx="8" fill="#232d1d" stroke="#ddd6c6" stroke-opacity="0.2"/><text x="265.7642585551331" y="352" font-size="15.5" fill="#ebe5d6" text-anchor="middle" font-weight="600" >len</text><text x="265.7642585551331" y="374" font-size="14.5" fill="#b9b3a3" text-anchor="middle">2 B</text><rect x="305.48669201520914" y="324" width="527.8859315589353" height="62" rx="8" fill="#2a2a18" stroke="#e9cd84" stroke-opacity="0.9"/><text x="569.4296577946768" y="352" font-size="15.5" fill="#e9cd84" text-anchor="middle" font-weight="600" >tlock ciphertext</text><text x="569.4296577946768" y="374" font-size="14.5" fill="#b9b3a3" text-anchor="middle">≤ 487 B · the sealed order</text><rect x="835.3726235741444" y="324" width="161.04182509505705" height="62" rx="8" fill="#232d1d" stroke="#ddd6c6" stroke-opacity="0.2"/><text x="915.8935361216729" y="352" font-size="15.5" fill="#ebe5d6" text-anchor="middle" font-weight="600" >envelope tag</text><text x="915.8935361216729" y="374" font-size="14.5" fill="#b9b3a3" text-anchor="middle">18 B</text><rect x="998.4144486692014" y="324" width="136.5855513307985" height="62" rx="8" fill="#232d1d" stroke="#ddd6c6" stroke-opacity="0.2"/><text x="1066.7072243346006" y="352" font-size="15.5" fill="#ebe5d6" text-anchor="middle" font-weight="600" >zeros</text><text x="1066.7072243346006" y="374" font-size="14.5" fill="#b9b3a3" text-anchor="middle">to 512</text><text x="64" y="436" font-size="17" fill="#ebe5d6" >Every memo is the same length and every deposit the same amount: on chain, a high bid and a low bid look identical.</text><text x="64" y="462" font-size="17" fill="#b9b3a3" >The tag is the first 18 bytes of SHA-256 of the bid's refund envelope, so that envelope can't be swapped for another.</text></g><rect x=".5" y=".5" width="1199" height="449" rx="22" fill="none" stroke="#ddd6c6" stroke-opacity=".12"/></svg>