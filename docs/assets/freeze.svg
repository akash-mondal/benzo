" rx="8" fill="#232d1d" stroke="#ddd6c6" stroke-opacity="0.25"/><text x="554" y="221" font-size="15" fill="#b9b3a3" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">H(01‖l‖r)</text><rect x="338" y="120" width="132" height="32" rx="8" fill="#2a2a18" stroke="#e9cd84" stroke-opacity="1"/><text x="404" y="141" font-size="15" fill="#e9cd84" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">frozen root</text><text x="64" y="428" font-size="16.5" fill="#b9b3a3" >leaf = SHA-256(00 ‖ SHA-256(ciphertext) ‖ the deposit's txid and address)</text><rect x="726" y="104" width="410" height="330" rx="14" fill="#1c2417" stroke="#ddd6c6" stroke-opacity=".16"/>
