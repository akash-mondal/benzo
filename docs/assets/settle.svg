<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="Settlement: the operator proposes an unsigned transaction; each signer independently opens the bids, re-runs clearing, opens refund envelopes, finds the deposits and checks every output; two of three sign one FROST spend." font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"><title>Settlement: the operator proposes an unsigned transaction; each signer independently opens the bids, re-runs clearing, opens refund envelopes, finds the deposits and checks every output; two of three sign one FROST spend.</title><defs><linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0.36"><stop offset="0" stop-color="#a99f86"/><stop offset=".3" stop-color="#fbf6e8"/><stop offset=".52" stop-color="#c2b799"/><stop offset=".74" stop-color="#f4eedd"/><stop offset="1" stop-color="#a99f86"/></linearGradient>
<linearGradient id="goldc" x1="0" y1="0" x2="1" y2="0.36"><stop offset="0" stop-color="#b89a52"/><stop offset=".35" stop-color="#f6e2a6"/><stop offset=".6" stop-color="#d9b866"/><stop offset="1" stop-color="#b89a52"/></linearGradient>
<linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4efe2"/><stop offset="1" stop-color="#d9d1bd"/></linearGradient>
<radialGradient id="night" cx="72%" cy="18%" r="85%"><stop offset="0" stop-color="#1f2a19"/><stop offset=".6" stop-color="#141a10"/></radialGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b9b3a3"/></marker>
<marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e9cd84"/></marker></defs><rect width="1200" height="470" rx="22" fill="url(#night)"/><g transform="translate(0 -50)"><rect x="64" y="110" width="260" height="330" rx="14" fill="#1c2417" stroke="#ddd6c6" stroke-opacity=".16"/>
    <svg x="159" y="141" width="70" height="70" viewBox="0 0 200 200"><defs><mask id="lg-1" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200"><rect width="200" height="200" fill="#fff"/><path d="M62 50 H138" fill="none" stroke="#000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M62 76 H106 M120 76 H138 M62 98 H106 M120 98 H138 M62 120 H106 M120 120 H138" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M114 66 V130" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M62 146 H138" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M98 162 H138" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></mask></defs><rect mask="url(#lg-1)" x="38" y="20" width="124" height="162" rx="14" fill="url(#chrome)"/><path d="M140 20 L162 42 H140 Z" fill="url(#chrome)"/></svg>
    <text x="194" y="250" font-size="22" fill="#ebe5d6" text-anchor="middle" font-weight="600">Operator</text>
    <text x="194" y="284" font-size="16" fill="#b9b3a3" text-anchor="middle">builds one unsigned Zcash</text><text x="194" y="308" font-size="16" fill="#b9b3a3" text-anchor="middle">transaction (a PCZT): pay</text><text x="194" y="332" font-size="16" fill="#b9b3a3" text-anchor="middle">the winners and sellers,</text><text x="194" y="356" font-size="16" fill="#b9b3a3" text-anchor="middle">refund everyone else</text>
    <text x="194" y="410" font-size="16" fill="#e9cd84" text-anchor="middle" font-weight="600">can propose, can't sign</text><rect x="382" y="110" width="476" height="330" rx="14" fill="#1c2417" stroke="#ddd6c6" stroke-opacity=".16"/>
    <text x="410" y="150" font-size="21" fill="#ebe5d6" font-weight="600">Each signer, on its own</text>
    <circle cx="424" cy="192" r="12" fill="#2a2a18" stroke="#e9cd84" stroke-opacity=".8"/><text x="424" y="197" font-size="13" fill="#e9cd84" text-anchor="middle" font-weight="700">1</text><text x="450" y="198" font-size="17" fill="#b9b3a3" >fetches σ_R and opens every bid</text><circle cx="424" cy="236" r="12" fill="#2a2a18" stroke="#e9cd84" stroke-opacity=".8"/><text x="424" y="241" font-size="13" fill="#e9cd84" text-anchor="middle" font-weight="700">2</text><text x="450" y="242" font-size="17" fill="#b9b3a3" >re-runs the market's clearing rule</text><circle cx="424" cy="280" r="12" fill="#2a2a18" stroke="#e9cd84" stroke-opacity=".8"/><text x="424" y="285" font-size="13" fill="#e9cd84" text-anchor="middle" font-weight="700">3</text><text x="450" y="286" font-size="17" fill="#b9b3a3" >opens refund envelopes with its own key</text><circle cx="424" cy="324" r="12" fill="#2a2a18" stroke="#e9cd84" stroke-opacity=".8"/><text x="424" y="329" font-size="13" fill="#e9cd84" text-anchor="middle" font-weight="700">4</text><text x="450" y="330" font-size="17" fill="#b9b3a3" >finds the deposits on chain itself</text><circle cx="424" cy="368" r="12" fill="#2a2a18" stroke="#e9cd84" stroke-opacity=".8"/><text x="424" y="373" font-size="13" fill="#e9cd84" text-anchor="middle" font-weight="700">5</text><text x="450" y="374" font-size="17" fill="#b9b3a3" >checks every output, amount and fee</text>
    <text x="410" y="420" font-size="17" fill="#ebe5d6" font-weight="600">Any mismatch, and it refuses to sign.</text><line x1="334" y1="275" x2="372" y2="275" stroke="#b9b3a3" stroke-width="2" marker-end="url(#arrow)"/><rect x="916" y="110" width="220" height="330" rx="14" fill="#1c2417" stroke="#ddd6c6" stroke-opacity=".16"/>
    <svg x="990" y="140" width="72" height="72" viewBox="0 0 200 200"><defs><mask id="sz2-2" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200"><rect width="200" height="200" fill="#fff"/><path d="M100 30 L154 50 V96 C154 134 130 158 100 170 C70 158 46 134 46 96 V50 Z" fill="none" stroke="#000" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M74 68 H126 L74 128 H126" fill="none" stroke="#000" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/></mask></defs><path mask="url(#sz2-2)" d="M100 16 L168 40 V96 C168 142 136 170 100 184 C64 170 32 142 32 96 V40 Z" fill="url(#goldc)"/></svg>
    <text x="1026" y="250" font-size="21" fill="#e9cd84" text-anchor="middle" font-weight="600">FROST, 2 of 3</text>
    <text x="1026" y="284" font-size="16" fill="#b9b3a3" text-anchor="middle">two signers run one</text><text x="1026" y="308" font-size="16" fill="#b9b3a3" text-anchor="middle">signing session; their</text><text x="1026" y="332" font-size="16" fill="#b9b3a3" text-anchor="middle">shares combine into one</text><text x="1026" y="356" font-size="16" fill="#b9b3a3" text-anchor="middle">ordinary signature</text>
    <text x="1026" y="410" font-size="16" fill="#ebe5d6" text-anchor="middle" font-weight="600">the vault is spent</text><line x1="868" y1="275" x2="906" y2="275" stroke="#e9cd84" stroke-width="2" marker-end="url(#arrowg)"/><text x="64" y="478" font-size="17" fill="#ebe5d6" >The key came from a dealerless DKG for this round only. No machine ever holds it whole; one signer alone can't move a zatoshi.</text></g><rect x=".5" y=".5" width="1199" height="469" rx="22" fill="none" stroke="#ddd6c6" stroke-opacity=".12"/></svg>