<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="A round in six steps: seal and pay, freeze, open at drand round R, clear, settle with 2 of 3 signers, verify." font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"><title>A round in six steps: seal and pay, freeze, open at drand round R, clear, settle with 2 of 3 signers, verify.</title><defs><linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0.36"><stop offset="0" stop-color="#a99f86"/><stop offset=".3" stop-color="#fbf6e8"/><stop offset=".52" stop-color="#c2b799"/><stop offset=".74" stop-color="#f4eedd"/><stop offset="1" stop-color="#a99f86"/></linearGradient>
<linearGradient id="goldc" x1="0" y1="0" x2="1" y2="0.36"><stop offset="0" stop-color="#b89a52"/><stop offset=".35" stop-color="#f6e2a6"/><stop offset=".6" stop-color="#d9b866"/><stop offset="1" stop-color="#b89a52"/></linearGradient>
<linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4efe2"/><stop offset="1" stop-color="#d9d1bd"/></linearGradient>
<radialGradient id="night" cx="72%" cy="18%" r="85%"><stop offset="0" stop-color="#1f2a19"/><stop offset=".6" stop-color="#141a10"/></radialGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b9b3a3"/></marker>
<marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e9cd84"/></marker></defs><rect width="1200" height="440" rx="22" fill="url(#night)"/><text x="64" y="64" font-size="28" fill="#ebe5d6" font-weight="600" letter-spacing="-.3">A round, from first bid to proof</text>
    <line x1="120" y1="184" x2="504" y2="184" stroke="#e9cd84" stroke-opacity=".6" stroke-width="3"/>
    <line x1="504" y1="184" x2="1080" y2="184" stroke="#ddd6c6" stroke-opacity=".25" stroke-width="3"/>
    <text x="312" y="112" font-size="16" fill="#e9cd84" text-anchor="middle" font-weight="600">sealed: nobody can read a bid</text>
    <text x="792" y="114" font-size="16" fill="#b9b3a3" text-anchor="middle" font-weight="600">opened: prices public, bidders still private</text><circle cx="120" cy="184" r="50" fill="#141a10"/>
      <circle cx="120" cy="184" r="50" fill="#1c2417" stroke="#ddd6c6" stroke-opacity="0.3" stroke-width="2"/>
      <svg x="90" y="154" width="60" height="60" viewBox="0 0 200 200"><defs><mask id="se-1" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200"><rect width="200" height="200" fill="#fff"/><path d="M30 60 L100 112 L170 60" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M30 150 L80 104 M170 150 L120 104" fill="none" stroke="#000" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="100" cy="118" r="20" fill="none" stroke="#000" stroke-width="3.5"/><text x="100" y="126" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="22" fill="#000">B</text></mask></defs><rect mask="url(#se-1)" x="18" y="46" width="164" height="112" rx="12" fill="url(#chrome)"/></svg>
      <text x="120" y="276" font-size="21" fill="#ebe5d6" text-anchor="middle" font-weight="600">1  Seal &amp; pay</text>
      <text x="120" y="306" font-size="16" fill="#b9b3a3" text-anchor="middle">sealed to round R in</text><text x="120" y="329" font-size="16" fill="#b9b3a3" text-anchor="middle">the browser; a fixed</text><text x="120" y="352" font-size="16" fill="#b9b3a3" text-anchor="middle">shielded deposit</text>
      <text x="120" y="392" font-size="15" fill="#8f8a7c" text-anchor="middle" font-weight="600">until T_submit</text><circle cx="312" cy="184" r="50" fill="#141a10"/>
      <circle cx="312" cy="184" r="50" fill="#1c2417" stroke="#ddd6c6" stroke-opacity="0.3" stroke-width="2"/>
      <svg x="282" y="154" width="60" height="60" viewBox="0 0 200 200"><defs><mask id="pl-2" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200"><rect width="200" height="200" fill="#fff"/><circle cx="100" cy="124" r="12" fill="none" stroke="#000" stroke-width="0"/><circle cx="100" cy="122" r="11" fill="#000"/><path d="M100 128 V150" fill="none" stroke="#000" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M56 104 H144 M56 162 H144" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></mask></defs><path d="M64 92 V66 A36 36 0 0 1 136 66 V92" fill="none" stroke="url(#chrome)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><rect mask="url(#pl-2)" x="42" y="88" width="116" height="92" rx="16" fill="url(#chrome)"/></svg>
      <text x="312" y="276" font-size="21" fill="#ebe5d6" text-anchor="middle" font-weight="600">2  Freeze</text>
      <text x="312" y="306" font-size="16" fill="#b9b3a3" text-anchor="middle">confirmed deposits</text><text x="312" y="329" font-size="16" fill="#b9b3a3" text-anchor="middle">form a Merkle tree;</text><text x="312" y="352" font-size="16" fill="#b9b3a3" text-anchor="middle">2 of 3 sign the root</text>
      <text x="312" y="392" font-size="15" fill="#8f8a7c" text-anchor="middle" font-weight="600">before R</text><circle cx="504" cy="184" r="50" fill="#141a10"/>
      <circle cx="504" cy="184" r="50" fill="#2a2a18" stroke="#e9cd84" stroke-opacity="1" stroke-width="3"/>
      <svg x="474" y="154" width="60" height="60" viewBox="0 0 200 200"><defs><mask id="dp-beacon-3" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200"><rect width="200" height="200" fill="#fff"/><path d="M100 44 V30 M70 54 L58 42 M130 54 L142 42 M60 74 H40 M140 74 H160" fill="none" stroke="#000" stroke-width="3.04" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(100 100) scale(0.8) translate(-100 -100)"><path d="M82 176 L90 82 H110 L118 176 Z" fill="none" stroke="#000" stroke-width="4.5"/></g></mask></defs><g mask="url(#dp-beacon-3)"><path d="M82 176 L90 82 H110 L118 176 Z" fill="url(#goldc)"/><rect x="80" y="62" width="40" height="22" rx="5" fill="url(#goldc)"/><path d="M100 44 V30 M70 54 L58 42 M130 54 L142 42 M60 74 H40 M140 74 H160" fill="none" stroke="url(#goldc)" stroke-width="11.7" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
      <text x="504" y="276" font-size="21" fill="#ebe5d6" text-anchor="middle" font-weight="600">3  Open</text>
      <text x="504" y="306" font-size="16" fill="#b9b3a3" text-anchor="middle">drand publishes R;</text><text x="504" y="329" font-size="16" fill="#b9b3a3" text-anchor="middle">its signature opens</text><text x="504" y="352" font-size="16" fill="#b9b3a3" text-anchor="middle">every bid at once</text>
      <text x="504" y="392" font-size="15" fill="#e9cd84" text-anchor="middle" font-weight="600">drand round R</text><circle cx="696" cy="184" r="50" fill="#141a10"/>
      <circle cx="696" cy="184" r="50" fill="#1c2417" stroke="#ddd6c6" stroke-opacity="0.3" stroke-width="2"/>
      <svg x="666" y="154" width="60" height="60" viewBox="0 0 200 200"><defs><mask id="dp-scales-4" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200"><rect width="200" height="200" fill="#fff"/><path d="M100 26 V170 M60 170 H140 M40 58 H160" fill="none" stroke="#000" stroke-width="3.04" stroke-linecap="round" stroke-linejoin="round"/><path d="M40 58 L18 112 H62 Z M160 58 L138 112 H182 Z" fill="none" stroke="#000" stroke-width="2.37" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(100 100) scale(0.8) translate(-100 -100)"><path d="M18 112 A22 14 0 0 0 62 112 Z M138 112 A22 14 0 0 0 182 112 Z" fill="none" stroke="#000" stroke-width="4.5"/></g></mask></defs><g mask="url(#dp-scales-4)"><path d="M100 26 V170 M60 170 H140 M40 58 H160" fill="none" stroke="url(#chrome)" stroke-width="11.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M40 58 L18 112 H62 Z M160 58 L138 112 H182 Z" fill="none" stroke="url(#chrome)" stroke-width="9.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 112 A22 14 0 0 0 62 112 Z M138 112 A22 14 0 0 0 182 112 Z" fill="url(#chrome)"/></g></svg>
      <text x="696" y="276" font-size="21" fill="#ebe5d6" text-anchor="middle" font-weight="600">4  Clear</text>
      <text x="696" y="306" font-size="16" fill="#b9b3a3" text-anchor="middle">the market's rule</text><text x="696" y="329" font-size="16" fill="#b9b3a3" text-anchor="middle">turns bids into fills,</text><text x="696" y="352" font-size="16" fill="#b9b3a3" text-anchor="middle">a price, refunds</text>
      <text x="696" y="392" font-size="15" fill="#8f8a7c" text-anchor="middle" font-weight="600">right after R</text><circle cx="888" cy="184" r="50" fill="#141a10"/>
      <circle cx="888" cy="184" r="50" fill="#1c2417" stroke="#ddd6c6" stroke-opacity="0.3" stroke-width="2"/>
      <svg x="858" y="154" width="60" height="60" viewBox="0 0 200 200"><defs><mask id="sz2-5" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200"><rect width="200" height="200" fill="#fff"/><path d="M100 30 L154 50 V96 C154 134 130 158 100 170 C70 158 46 134 46 96 V50 Z" fill="none" stroke="#000" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M74 68 H126 L74 128 H126" fill="none" stroke="#000" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/></mask></defs><path mask="url(#sz2-5)" d="M100 16 L168 40 V96 C168 142 136 170 100 184 C64 170 32 142 32 96 V40 Z" fill="url(#chrome)"/></svg>
      <text x="888" y="276" font-size="21" fill="#ebe5d6" text-anchor="middle" font-weight="600">5  Settle</text>
      <text x="888" y="306" font-size="16" fill="#b9b3a3" text-anchor="middle">2 of 3 signers</text><text x="888" y="329" font-size="16" fill="#b9b3a3" text-anchor="middle">recheck it all, then</text><text x="888" y="352" font-size="16" fill="#b9b3a3" text-anchor="middle">sign one FROST spend</text>
      <text x="888" y="392" font-size="15" fill="#8f8a7c" text-anchor="middle" font-weight="600">a few blocks</text><circle cx="1080" cy="184" r="50" fill="#141a10"/>
      <circle cx="1080" cy="184" r="50" fill="#1c2417" stroke="#ddd6c6" stroke-opacity="0.3" stroke-width="2"/>
      <svg x="1050" y="154" width="60" height="60" viewBox="0 0 200 200"><defs><mask id="mg-6" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200"><rect width="200" height="200" fill="#fff"/><circle cx="84" cy="84" r="40" fill="none" stroke="#000" stroke-width="3.5"/><path d="M62 60 A30 30 0 0 1 84 50" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></mask></defs><g mask="url(#mg-6)"><circle cx="84" cy="84" r="54" fill="url(#chrome)"/></g><path d="M124 124 L172 172" fill="none" stroke="url(#chrome)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <text x="1080" y="276" font-size="21" fill="#ebe5d6" text-anchor="middle" font-weight="600">6  Verify</text>
      <text x="1080" y="306" font-size="16" fill="#b9b3a3" text-anchor="middle">one file rebuilds</text><text x="1080" y="329" font-size="16" fill="#b9b3a3" text-anchor="middle">the round from the</text><text x="1080" y="352" font-size="16" fill="#b9b3a3" text-anchor="middle">public record</text>
      <text x="1080" y="392" font-size="15" fill="#8f8a7c" text-anchor="middle" font-weight="600">any time</text><rect x=".5" y=".5" width="1199" height="439" rx="22" fill="none" stroke="#ddd6c6" stroke-opacity=".12"/></svg>